[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dlviz"
dynamic = ["version"]
description = "Visualizaciones interactivas para el curso de Deep Learning (Universidad de Chile)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ivan Sipiran", email = "isipiran@dcc.uchile.cl" }]
keywords = ["deep-learning", "education", "visualization", "colab", "perceptron"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Education",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "numpy>=1.20",
  "matplotlib>=3.4",
  "ipywidgets>=7.6",
]

[project.urls]
Homepage = "https://github.com/ivansipiran/dlviz"
Repository = "https://github.com/ivansipiran/dlviz"

[tool.setuptools.dynamic]
version = { attr = "dlviz.__version__" }

[tool.setuptools.packages.find]
where = ["src"]